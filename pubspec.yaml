name: Ratedly
description: A new Flutter project.
version: 1.0.26+25

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  firebase_messaging: ^16.2.2
  firebase_analytics: ^12.4.1

  # Auth
  google_sign_in: ^6.1.11
  sign_in_with_apple: ^7.0.1

  # Storage & Preferences
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # Media
  image_picker: ^1.1.2
  image: ^4.0.17
  flutter_image_compress: ^2.0.0
  video_player: ^2.8.2
  video_trimmer: ^5.0.0
  camera: ^0.10.5+9
  photo_manager: ^3.3.0

  # UI & Display
  cached_network_image: ^3.3.0
  flutter_native_splash: ^2.3.10
  flutter_local_notifications: ^19.3.0
  country_code_picker: ^3.4.1
  country_flags: ^4.1.0

  # Monetization
  google_mobile_ads: ^8.0.0
  in_app_purchase: ^3.2.3

  # Utilities
  provider: ^6.0.1
  uuid: ^4.5.1
  timeago: ^3.7.0
  share_plus: ^11.1.0
  permission_handler: ^11.0.0
  country_detector: ^1.0.2+1
  supabase_flutter: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/logo/22.png
    - assets/logo/google-logo.png
    - assets/logo/apple-logo.png

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
        - asset: assets/fonts/Montserrat-Italic-VariableFont_wght.ttf
          style: italic
