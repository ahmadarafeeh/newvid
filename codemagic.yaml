workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 59
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: "com.ios.ratedly"
      flutter: 3.27.4
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ios.ratedly
        certificates:
          - iOS Distribution Certificate   # Make sure this matches the name in Codemagic UI

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Pod repo update
        script: |
          cd ios && pod repo update

      - name: Create export_options.plist
        script: |
          cat > /Users/builder/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>R97R49L336</string>
          </dict>
          </plist>
          EOF

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - ahmadarafeh9@gmail.com
        notify:
          success: true
          failure: true
