workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 59
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: "com.ios.ratedly"
      flutter: 3.27.4
      xcode: latest
      cocoapods: default
      # Optional: If you have certificates stored in Codemagic, you can reference them.
      # For automatic signing, you don't need to list provisioning profiles.
      ios_signing:
        distribution_type: app_store          # or "development"
        bundle_identifier: com.ios.ratedly
        # No 'provisioning_profiles' needed – Codemagic will create/manage them automatically.
        # If you have a distribution certificate stored in Codemagic, reference it:
        certificates:
          - iOS Distribution Certificate       # Replace with your certificate's reference name

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      # No 'xcode-project use-profiles' needed – automatic signing handles it.

      - name: Pod repo update
        script: |
          cd ios && pod repo update

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - ahmadarafeh9@gmail.com
        notify:
          success: true
          failure: true
