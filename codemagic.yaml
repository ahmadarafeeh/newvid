workflows:
  ios-build:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Disable SPM globally and clean artifacts
        script: |
          flutter config --no-enable-swift-package-manager
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          rm -rf ios/Runner.xcworkspace/xcshareddata/swiftpm
          rm -rf ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          find . -name "Package.resolved" -type f -delete

      - name: Install CocoaPods dependencies
        script: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA with explicit SPM disable flag
        script: |
          flutter build ipa --release \
            --no-enable-swift-package-manager \
            --export-options-plist /Users/builder/export_options.plist \
            --build-number=$BUILD_NUMBER
