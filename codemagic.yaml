workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: "com.ios.ratedly"
      flutter: 3.27.4
      xcode: latest
      cocoapods: default
      # ios_signing block removed – it's for manual signing only.
      # Since you're using integrations.app_store_connect, Codemagic will auto-fetch profiles.

    integrations:
      app_store_connect: Codemagic   # This name must match exactly what you set in Codemagic UI → Teams → Integrations

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Set up code signing
        script: |
          # Explicitly point to the Xcode project and enable verbose logging to debug profile issues
          xcode-project use-profiles --project ios/Runner.xcodeproj --code-signing-setup-verbose-logging

      - name: Pod repo update
        script: |
          cd ios && pod repo update

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - ahmadarafeh9@gmail.com
        notify:
          success: true
          failure: true
