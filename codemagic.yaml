workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: "com.ios.ratedly"
      flutter: 3.27.4
      xcode: latest
      cocoapods: default
      # This block is REQUIRED even with automatic signing.
      # It tells Codemagic which profile to fetch.
      ios_signing:
        distribution_type: app_store      # 'app_store' for App Store distribution
        bundle_identifier: com.ios.ratedly

    integrations:
      # The name must exactly match the API key name in Codemagic UI → Team → Integrations
      app_store_connect: Codemagic

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Update CocoaPods repository
        script: |
          cd ios && pod repo update

      - name: Set up code signing
        script: |
          # This will now fetch the App Store profile using your API key
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build IPA for App Store
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - ahmadarafeh9@gmail.com
        notify:
          success: true
          failure: true
