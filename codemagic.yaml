workflows:
  ios-build:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Disable Swift Package Manager globally
        script: |
          flutter config --no-enable-swift-package-manager
          # Verify it's disabled
          flutter config | grep "enable-swift-package-manager" || true

      - name: Clean and remove SPM artifacts
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          rm -rf ios/Runner.xcworkspace/xcshareddata/swiftpm
          rm -rf ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          find . -name "Package.resolved" -type f -delete

      - name: Get dependencies and install CocoaPods
        script: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA for distribution
        script: |
          flutter build ipa --release \
            --export-options-plist /Users/builder/export_options.plist \
            --build-number=$BUILD_NUMBER
